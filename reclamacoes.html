<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reclamações e Comentários | Quiz Filosófico</title>
  <link rel="stylesheet" href="reclamacoes.css" />
</head>
<body>
  <header>
    <div class="logo">
      <img src="Arquivos/Logótipo estilizado .png" alt="Logótipo" />
      <span>QUIZ FILOSÓFICO</span>
    </div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Início</a></li>
        <li><a href="regras.html">Regras</a></li>
        <li><a href="reclamacoes.html">Reclamações</a></li>
      </ul>
      <div class="menu-toggle">☰</div>
    </nav>
  </header>

  <main>
    <section class="comentarios">
      <h1>Reclamações ou Comentários</h1>
      <form action="https://formsubmit.co/quizfilosofico@gmail.com" method="POST">
        <label for="email">Seu e-mail (obrigatório):</label>
        <input type="email" id="email" name="email" required placeholder="exemplo@email.com" />

        <label for="mensagem">Está tendo dificuldades? Explique…</label>
        <textarea id="mensagem" name="mensagem" rows="6" required></textarea>

        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <footer>
    <div class="social">
      
    </div>
    <p>&copy; 2025 Quiz Filosófico. Todos os direitos reservados.</p>
  </footer>

  <script>
    const toggle = document.querySelector('.menu-toggle');
    const navLinks = document.querySelector('.nav-links');
    toggle.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });
  </script>
</body>
</html>
