<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensagem Enviada</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .mensagem-container {
      max-width: 600px;
      margin: 5rem auto;
      padding: 2rem;
      text-align: center;
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
    }

    .mensagem-container h1 {
      color: #53d466;
      margin-bottom: 1rem;
    }

    .mensagem-container p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .mensagem-container .btn {
      display: inline-block;
      background-color: #4f8555;
      color: #fff;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 1rem;
      transition: background 0.3s;
    }

    .mensagem-container .btn:hover {
      background-color: #53d466;
    }
  </style>
</head>
<body>
  <main>
    <div class="mensagem-container">
      <h1>✅ Dados enviados com sucesso!</h1>
      <p>Obrigado por submeter o formulário. Em breve receberá uma resposta.</p>
      <a href="index.html" class="btn">⬅️ Voltar ao Início</a>
    </div>
  </main>
</body>
</html>
